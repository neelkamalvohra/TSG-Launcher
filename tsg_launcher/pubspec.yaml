name: tsg_launcher
description: TSG Application — tile-based web app launcher.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # In-app WebView — used for OAuth2 login AND tile web app embedding.
  # Keeps Authentik session cookies alive across all WebViews (SSO).
  flutter_inappwebview: ^6.1.5

  # Secure token storage (Keychain on iOS, Keystore on Android)
  flutter_secure_storage: ^9.2.4

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Declarative routing with auth/role guards
  go_router: ^14.8.1

  # HTTP client for Authentik REST API
  dio: ^5.8.0+1

  # Tile icon image caching
  cached_network_image: ^3.4.1

  # JWT parsing (id_token claims → username, groups, email)
  dart_jsonwebtoken: ^2.14.1

  # PKCE code verifier / challenge generation
  crypto: ^3.0.6

  # UUID generation
  uuid: ^4.5.1

  # Biometric authentication (fingerprint / face unlock)
  local_auth: ^2.3.0

  # Masonry / staggered grid — auto-height tile grid
  flutter_staggered_grid_view: ^0.7.0

  # Camera / gallery image picker — used by RosterUploadScreen
  image_picker: ^1.1.2

  # SVG rendering for local tile icons
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icon/
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
