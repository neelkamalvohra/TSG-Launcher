<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9C3DC8"/>
      <stop offset="100%" stop-color="#4A0090"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>
  <!-- Upload arrow (pointing up) -->
  <polygon points="50,18 35,38 42,38 42,56 58,56 58,38 65,38" fill="white"/>
  <!-- Horizontal line under arrow -->
  <rect x="34" y="60" width="32" height="4" rx="2" fill="white" opacity="0.6"/>
  <!-- Inbox tray base -->
  <rect x="20" y="68" width="60" height="16" rx="6" fill="white"/>
  <!-- Tray inner slot highlight -->
  <rect x="24" y="71" width="30" height="4" rx="2" fill="white" opacity="0.35"/>
</svg>
