<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C89A20"/>
      <stop offset="100%" stop-color="#6B4500"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>
  <!-- Pencil body rotated 45 degrees, pointing bottom-right -->
  <g transform="translate(50,50) rotate(-45)">
    <!-- Eraser cap -->
    <rect x="-9" y="-38" width="18" height="10" rx="3" fill="#F4A0A0"/>
    <!-- Eraser ferrule (metal band) -->
    <rect x="-9" y="-29" width="18" height="5" fill="#D0D0D0" opacity="0.9"/>
    <!-- Pencil body -->
    <rect x="-9" y="-24" width="18" height="44" rx="2" fill="white"/>
    <!-- Wood tip triangle -->
    <polygon points="-9,20 9,20 0,36" fill="white"/>
    <!-- Graphite tip -->
    <polygon points="-4,28 4,28 0,36" fill="#777"/>
  </g>
</svg>
