networks:
  default:
    driver: bridge

services:
  # PostgreSQL Database for n8n
  postgres_n8n:
    image: postgres:16
    container_name: postgres_n8n
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_N8N_USER:-n8n_user}
      - POSTGRES_PASSWORD=${POSTGRES_N8N_PASSWORD:-n8n_password}
      - POSTGRES_DB=${POSTGRES_N8N_DB:-n8n_db}
      - TZ=${TZ:-Asia/Calcutta}
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - ./volumes/postgres_n8n:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_N8N_USER:-n8n_user} -d ${POSTGRES_N8N_DB:-n8n_db}']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - default

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    environment:
      - TZ=${TZ:-Asia/Calcutta}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - default


  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: n8n_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-automation_flow}
      MYSQL_USER: ${MYSQL_USER:-n8n_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-n8n_password}
      TZ: ${TZ:-Asia/Calcutta}
    ports:
      - "3306:3306"
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - default

  n8n:
    container_name: "n8n"
    restart: unless-stopped
    ports:
      - "5555:5678"
    image: docker.n8n.io/n8nio/n8n
    stdin_open: true
    depends_on:
      postgres_n8n:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./volumes/n8n:/home/node/.n8n
      - ./volumes/n8n/data/ocr:/data/ocr
    environment:
      - TZ=${TZ:-Asia/Calcutta}
      - WEBHOOK_URL=http://192.168.1.174:5555
      - N8N_EDITOR_BASE_URL=http://192.168.1.174:5555
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - NODE_FUNCTION_ALLOW_EXTERNAL=xlsx
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_SECURE_COOKIE=false
      - 'N8N_NODES_INCLUDE=["n8n-nodes-base.mysql", "n8n-nodes-base.postgres"]'
      - GENERIC_TIMEZONE=${TZ:-Asia/Calcutta}
      # PostgreSQL Database Configuration for N8N internal storage
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${POSTGRES_N8N_DB:-n8n_db}
      - DB_POSTGRESDB_HOST=postgres_n8n
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_N8N_USER:-n8n_user}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_N8N_PASSWORD:-n8n_password}
      # Redis Configuration for caching
      - N8N_CACHE_ENABLED=true
      - N8N_CACHE_TYPE=redis
      - N8N_REDIS_HOST=redis
      - N8N_REDIS_PORT=6379
      - N8N_REDIS_DB=1
      - 'N8N_REDIS_PREFIX=n8n_cache:'
      # Database connections available for workflows
      - POSTGRES_HOST=postgres_n8n
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${POSTGRES_N8N_DB:-n8n_db}
      - POSTGRES_USER=${POSTGRES_N8N_USER:-n8n_user}
      - POSTGRES_PASSWORD=${POSTGRES_N8N_PASSWORD:-n8n_password}
      # MySQL (for legacy workflows that need it)
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-automation_flow}
      - MYSQL_USER=${MYSQL_USER:-n8n_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-n8n_password}
    networks:
      - default

  # ── TSG Auth Service ──────────────────────────────────────────────────────────

  # Dedicated PostgreSQL for TSG Auth (separate DB)
  postgres_tsg_auth:
    image: postgres:16-alpine
    container_name: postgres_tsg_auth
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${TSG_AUTH_PG_USER:-tsg_auth}
      - POSTGRES_PASSWORD=${TSG_AUTH_PG_PASSWORD}
      - POSTGRES_DB=${TSG_AUTH_PG_DB:-tsg_auth}
      - TZ=${TZ:-Asia/Calcutta}
    ports:
      - "5435:5432"
    volumes:
      - ./volumes/postgres_tsg_auth:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${TSG_AUTH_PG_USER:-tsg_auth} -d ${TSG_AUTH_PG_DB:-tsg_auth}']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - default

  # TSG Auth FastAPI service — login, user management, tile access control
  tsg_auth:
    build: ./tsg_auth
    container_name: tsg_auth
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres_tsg_auth:
        condition: service_healthy
    environment:
      - TSG_AUTH_DATABASE_URL=postgresql://${TSG_AUTH_PG_USER:-tsg_auth}:${TSG_AUTH_PG_PASSWORD}@postgres_tsg_auth:5432/${TSG_AUTH_PG_DB:-tsg_auth}
      - TSG_AUTH_JWT_SECRET=${TSG_AUTH_JWT_SECRET}
      - TSG_AUTH_INIT_SUPERADMIN_USERNAME=${TSG_AUTH_INIT_SUPERADMIN_USERNAME:-superadmin}
      - TSG_AUTH_INIT_SUPERADMIN_PASSWORD=${TSG_AUTH_INIT_SUPERADMIN_PASSWORD}
      - TSG_AUTH_INIT_SUPERADMIN_EMAIL=${TSG_AUTH_INIT_SUPERADMIN_EMAIL:-superadmin@tsg.local}
      - TZ=${TZ:-Asia/Calcutta}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - default

  image_preprocessor:
    container_name: image_preprocessor
    build:
      context: .
      dockerfile: Dockerfile.preprocessor
    restart: unless-stopped
    networks:
      - default
